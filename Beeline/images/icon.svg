<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="ffbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d3566"/>
    <stop offset="1" stop-color="#080d1f"/>
  </linearGradient>
  <radialGradient id="ffspot" cx="0.5" cy="0.38" r="0.55">
    <stop offset="0" stop-color="#9fd0ff" stop-opacity="0.30"/>
    <stop offset="0.7" stop-color="#9fd0ff" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0b8"/>
    <stop offset="0.45" stop-color="#d9a84e"/>
    <stop offset="1" stop-color="#8a5f1c"/>
  </linearGradient>
  <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff6f8c"/>
    <stop offset="0.45" stop-color="#d23a5c"/>
    <stop offset="1" stop-color="#6e1029"/>
  </linearGradient>
  <linearGradient id="beebody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe27a"/>
    <stop offset="1" stop-color="#e9a020"/>
  </linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#9fd0ff" stop-opacity="0.75"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="round"><rect width="512" height="512" rx="108"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="512" height="512" fill="url(#ffbg)"/>
  <rect width="512" height="512" fill="url(#ffspot)"/>

  <!-- faint map grid and contour lines -->
  <g stroke="#9fd0ff" stroke-opacity="0.10" stroke-width="3" fill="none">
    <path d="M0 128 H512 M0 256 H512 M0 384 H512 M128 0 V512 M256 0 V512 M384 0 V512"/>
  </g>
  <g stroke="#9fd0ff" stroke-opacity="0.13" stroke-width="4" fill="none">
    <path d="M40 470 C120 420 160 460 240 430 S380 470 470 420"/>
    <path d="M60 90 C130 60 180 120 250 80"/>
    <path d="M330 470 C380 430 430 450 490 400"/>
  </g>

  <!-- dotted straight line: the "bee-line" -->
  <g filter="url(#glow2)">
    <line x1="112" y1="412" x2="330" y2="196" stroke="#ffd27a" stroke-width="15" stroke-linecap="round" stroke-dasharray="0 34"/>
  </g>

  <!-- map pin -->
  <g transform="translate(352 168)" filter="url(#shadow)">
    <ellipse cx="0" cy="42" rx="36" ry="11" fill="#000" opacity="0.35"/>
    <path d="M0 40 C-14 10 -62 -22 -62 -64 A62 62 0 0 1 62 -64 C62 -22 14 10 0 40 Z"
          fill="url(#pin)" stroke="#1b1233" stroke-width="9" stroke-linejoin="round"/>
    <circle cx="0" cy="-64" r="27" fill="#fff4dc" stroke="#1b1233" stroke-width="8"/>
    <circle cx="0" cy="-64" r="11" fill="#d9a84e"/>
    <path d="M-40 -92 Q-30 -112 -8 -118" stroke="#ffd0dc" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- bee, flying up the line toward the pin (chubby and cute) -->
  <g transform="translate(184 334) rotate(-22)" filter="url(#shadow)">
    <!-- motion puffs -->
    <g fill="#cfe6ff" opacity="0.5">
      <circle cx="-118" cy="22" r="11"/>
      <circle cx="-146" cy="34" r="7"/>
      <circle cx="-166" cy="44" r="4"/>
    </g>
    <!-- wings (behind) -->
    <g stroke="#1b1233" stroke-width="7" stroke-linejoin="round">
      <path d="M-34 -40 C-78 -112 -10 -136 -2 -62 Z" fill="url(#wing)"/>
      <path d="M2 -46 C10 -126 76 -110 26 -44 Z" fill="url(#wing)"/>
    </g>
    <!-- stinger -->
    <path d="M-70 16 L-96 22 L-70 30 Z" fill="#1b1233" stroke="#1b1233" stroke-width="5" stroke-linejoin="round"/>
    <!-- chubby body -->
    <ellipse cx="-14" cy="18" rx="62" ry="52" fill="url(#beebody)" stroke="#1b1233" stroke-width="9"/>
    <clipPath id="bodyclip"><ellipse cx="-14" cy="18" rx="58" ry="48"/></clipPath>
    <g clip-path="url(#bodyclip)" fill="#3a2a1a">
      <rect x="-52" y="-40" width="17" height="120" rx="8"/>
      <rect x="-20" y="-40" width="17" height="120" rx="8"/>
    </g>
    <path d="M-50 -8 Q-24 -26 4 -20" stroke="#fff6c8" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- little legs -->
    <g stroke="#1b1233" stroke-width="6" stroke-linecap="round">
      <line x1="-30" y1="66" x2="-34" y2="80"/>
      <line x1="-6" y1="68" x2="-4" y2="82"/>
    </g>
    <!-- antennae with hearts -->
    <g stroke="#1b1233" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M44 -32 Q46 -62 30 -78"/>
      <path d="M64 -26 Q82 -52 100 -58"/>
    </g>
    <path d="M30 -72 C22 -84 6 -76 16 -66 L30 -54 L44 -66 C54 -76 38 -84 30 -72 Z" fill="#ff6f8c" stroke="#1b1233" stroke-width="4" transform="translate(0 -10) scale(0.9) translate(3 -6)"/>
    <path d="M100 -52 C92 -64 76 -56 86 -46 L100 -34 L114 -46 C124 -56 108 -64 100 -52 Z" fill="#ff6f8c" stroke="#1b1233" stroke-width="4" transform="translate(0 -14)"/>
    <!-- big round head -->
    <circle cx="54" cy="4" r="46" fill="url(#beebody)" stroke="#1b1233" stroke-width="9"/>
    <!-- eyes -->
    <ellipse cx="44" cy="-2" rx="10" ry="13" fill="#1b1233"/>
    <ellipse cx="76" cy="-4" rx="10" ry="13" fill="#1b1233"/>
    <circle cx="47" cy="-7" r="4.5" fill="#ffffff"/>
    <circle cx="79" cy="-9" r="4.5" fill="#ffffff"/>
    <circle cx="41" cy="3" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="73" cy="1" r="2" fill="#ffffff" opacity="0.8"/>
    <!-- blush -->
    <ellipse cx="32" cy="18" rx="10" ry="6" fill="#ff7f9e" opacity="0.75"/>
    <ellipse cx="88" cy="16" rx="10" ry="6" fill="#ff7f9e" opacity="0.75"/>
    <!-- smile -->
    <path d="M52 18 Q60 28 68 17" stroke="#1b1233" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- sparkles -->
  <path d="M70 74 L74.32 87.68 L88 92 L74.32 96.32 L70 110 L65.68 96.32 L52 92 L65.68 87.68 Z" fill="#fff0c8"/>
  <path d="M452 323 L455.12 332.88 L465 336 L455.12 339.12 L452 349 L448.88 339.12 L439 336 L448.88 332.88 Z" fill="#fff0c8" opacity="0.8"/>
  <path d="M440 70 L442.6 78.4 L451 81 L442.6 83.6 L440 92 L437.4 83.6 L429 81 L437.4 78.4 Z" fill="#fff0c8" opacity="0.6"/>

  <!-- gold frame -->
  <rect x="14" y="14" width="484" height="484" rx="94" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <rect x="25" y="25" width="462" height="462" rx="84" fill="none" stroke="#d9a84e" stroke-opacity="0.35" stroke-width="2"/>
</g>
</svg>
